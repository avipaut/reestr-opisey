{% load static %}<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — Реестр описей</title><link rel="stylesheet" href="{% static 'web/app.css' %}">
<link rel="icon" href="{% static 'web/icon.svg' %}" type="image/svg+xml">
<style>.login{max-width:360px;margin:12vh auto;padding:0 16px}.login form{display:grid;gap:12px}.login label{display:grid;gap:4px;font-size:12px;color:var(--ink-2)}.login input{height:38px;padding:0 10px;border:1px solid var(--line-2);border-radius:6px}</style>
</head>
<body><div class="login card pad">
  <h1>Реестр описей</h1><p class="sub">Вход</p>
  {% if form.errors %}<ul class="msgs"><li class="error">Неверное имя пользователя или пароль</li></ul>{% endif %}
  <form method="post">{% csrf_token %}
    <label>Пользователь<input name="username" autocomplete="username" required autofocus></label>
    <label>Пароль<input name="password" type="password" autocomplete="current-password" required></label>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn primary" type="submit">Войти</button>
  </form>
</div></body></html>
